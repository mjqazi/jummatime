<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Jumma Time social preview</title>
  <desc id="desc">Find the next Jumma near you with community-posted Friday prayer times at nearby masjids.</desc>
  <rect width="1200" height="630" fill="#0F2A1E"/>
  <circle cx="1040" cy="94" r="210" fill="#1F3A2C"/>
  <circle cx="112" cy="548" r="180" fill="#1F3A2C"/>
  <rect x="72" y="72" width="1056" height="486" rx="32" fill="#FDFAF3"/>
  <rect x="94" y="94" width="1012" height="442" rx="22" fill="#F5EFE0" stroke="#E5D2B0" stroke-width="2"/>
  <svg x="112" y="104" width="140" height="140" viewBox="0 0 512 512">
    <linearGradient id="ogbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b5238"/><stop offset="1" stop-color="#0b261a"/>
    </linearGradient>
    <linearGradient id="oggold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dc93"/><stop offset="1" stop-color="#c2963c"/>
    </linearGradient>
  <rect width="512" height="512" rx="112" fill="url(#ogbg)"/>
  
  <!-- crescent cradling the clock -->
  <path d="M256 92 A174 174 0 1 0 430 266 A148 148 0 1 1 256 92 Z" fill="url(#oggold)"/>
  <!-- clock face -->
  <circle cx="276" cy="262" r="108" fill="#fbf6e8"/>
  <circle cx="276" cy="262" r="108" fill="none" stroke="#c2963c" stroke-width="6"/>
  <!-- hour ticks -->
  <g stroke="#17452f" stroke-width="7" stroke-linecap="round">
    <line x1="276" y1="170" x2="276" y2="186"/>
    <line x1="368" y1="262" x2="352" y2="262"/>
    <line x1="276" y1="354" x2="276" y2="338"/>
    <line x1="184" y1="262" x2="200" y2="262"/>
  </g>
  <!-- hands at 1:30 -->
  <line x1="276" y1="262" x2="304" y2="214" stroke="#17452f" stroke-width="11" stroke-linecap="round"/>
  <line x1="276" y1="262" x2="276" y2="330" stroke="#17452f" stroke-width="7" stroke-linecap="round"/>
  <circle cx="276" cy="262" r="10" fill="#c2963c"/>
  <!-- small dome + finial on top of the clock -->
  <path d="M236 160 C236 134 254 120 276 112 C298 120 316 134 316 160 Z" fill="#fbf6e8"/>
  <rect x="273" y="88" width="6" height="26" rx="3" fill="url(#oggold)"/>
  <circle cx="276" cy="86" r="7" fill="url(#oggold)"/>
</svg>
  <text x="280" y="186" fill="#9C7639" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="5">JUMMA TIME</text>
  <text x="112" y="346" fill="#0F2A1E" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700">Find the next</text>
  <text x="112" y="434" fill="#9C7639" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-style="italic" font-weight="700">Jumma near you</text>
  <text x="112" y="494" fill="#3F3D38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600">Community-posted Friday prayer times at nearby masjids.</text>
  <rect x="838" y="128" width="226" height="64" rx="32" fill="#0F2A1E"/>
  <text x="951" y="169" text-anchor="middle" fill="#FDFAF3" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Free app</text>
</svg>
